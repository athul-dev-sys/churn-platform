server {
    listen 80;
    server_name _;

    # Static SPA only. /api/* is routed by the ALB to churn-api — do not
    # proxy to ephemeral task IPs from this container.
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Optional health for ALB target checks hitting the web task directly
    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"churn-web"}';
    }
}
